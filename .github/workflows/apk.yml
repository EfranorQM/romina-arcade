name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android si no existe
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # El puente de orientacion. android/ esta en .gitignore y se acaba de
      # regenerar, asi que MainActivity.java hay que reponerlo desde
      # android-src/, que si se versiona. Sin esto el APK de CI saldria sin
      # puente y SURVIVAL volveria a pedir el giro a mano.
      - name: Instalar el puente de orientacion
        run: |
          mkdir -p android/app/src/main/java/com/romina/juegos
          cp android-src/MainActivity.java android/app/src/main/java/com/romina/juegos/MainActivity.java

      # El tema de pantalla completa, por el mismo motivo que el puente: vive en
      # android-src/ porque android/ se acaba de regenerar. Sin esto el APK de
      # CI saldria con la barra de estado y la de navegacion encima del juego.
      - name: Instalar el tema de pantalla completa
        run: |
          mkdir -p android/app/src/main/res/values
          cp android-src/styles.xml android/app/src/main/res/values/styles.xml

      - name: Quitar permiso de INTERNET y arrancar apaisado
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i 's|<manifest \(xmlns:android="[^"]*"\)|<manifest \1 xmlns:tools="http://schemas.android.com/tools"|' $M
          grep -q 'INTERNET" tools:node="remove"' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />\n\n    <application|' $M
          # La orientacion de ARRANQUE es apaisada porque la primera pantalla es
          # el menu (600x270). A partir de ahi manda el puente, escena a escena.
          # Ojo: aqui decia "portrait", que ademas de estar mal para el menu solo
          # se aplicaba si NO habia ya un screenOrientation; ahora se fuerza
          # siempre, igual que hace build-apk.ps1.
          if grep -q 'screenOrientation="' $M; then
            sed -i 's|screenOrientation="[a-zA-Z]*"|screenOrientation="sensorLandscape"|' $M
          else
            sed -i 's|<activity |<activity android:screenOrientation="sensorLandscape" android:resizeableActivity="false" |' $M
          fi
          cat $M

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RominaArcade-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
