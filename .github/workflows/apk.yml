name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android si no existe
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Quitar permiso de INTERNET y fijar vertical
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'xmlns:tools' $M || sed -i 's|<manifest \(xmlns:android="[^"]*"\)|<manifest \1 xmlns:tools="http://schemas.android.com/tools"|' $M
          grep -q 'INTERNET" tools:node="remove"' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />\n\n    <application|' $M
          grep -q 'screenOrientation' $M || sed -i 's|<activity |<activity android:screenOrientation="portrait" android:resizeableActivity="false" |' $M
          cat $M

      - name: Dar permiso de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RominaArcade-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
