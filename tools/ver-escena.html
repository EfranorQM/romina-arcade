<!doctype html>
<!-- LA ESCENA REAL de ROMINA, grabada fotograma a fotograma.

     No es una imitacion: importa caballero.js tal cual, la mueve con un GUION
     de botones (el stick y los cuatro botones, como un pulgar) a 60 pasos por
     segundo, y la dibuja con su camara y sus particulas igual que el bucle de
     main.js. Cada fotograma va a una celda de la tira, que tools/gif.py
     convierte en GIF:

       python tools/gif.py escena:arena vistas/arena.gif

     Guiones: arena (sube a la repisa, el pisoton pasa por debajo, caen los
     cascotes y baja a pegarle), parada (para el garrotazo y CONTRAATACA),
     barrido (lo esquiva hacia atras) y embestida (la esquiva atravesandolo y
     el ogro se estrella contra la pared). Esos empiezan YA peleando y con las
     lecciones aprendidas (sin consejos ni camara lenta). Y dos de la partida:
     inicio (elegir la dificultad y la entrada) y victoria (el remate, el
     final a camara lenta y la nota). -->
<meta charset="utf-8">
<style>body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="tira"></canvas>
<script type="module">
import { initCanvas, setVirtual, cam } from '../www/js/core.js';
import { updateParticles, drawParticles } from '../www/js/gfx.js';
import escena from '../www/js/games/caballero.js';
import { cargaRomina } from '../www/js/games/romi-sprite.js';
import { cargaOgro } from '../www/js/games/ogro-sprite.js';
import { cargaArena } from '../www/js/games/arena-sprite.js';
import * as OG from '../www/js/games/ogro-cuerpo.js';
import * as AR from '../www/js/games/caba-arena.js';
import * as P from '../www/js/games/caba-partida.js';

await Promise.all([cargaRomina(), cargaOgro(), cargaArena()]);
const DT = 1 / 60;

// Un guion: que se pulsa en cada paso. Mira el estado de la escena (donde
// estan ella y el ogro) en vez de ir a ciegas por el reloj, como haria alguien
// jugando.
const GUIONES = {
  arena(n, E, m) {
    const K = E.K, O = E.O, R = AR.REPISAS[0];
    E.salta = false; E.golpea = false; E.esquiva = false;
    if (n === 0) { O.esperaT = 99; }                  // el ogro espera a su señal
    if (m.fase === 0) {
      // 1. corre hacia la repisa izquierda y salta ANTES de llegar: en el aire
      // conserva la carrerilla (240 px/s), y hasta caer a la altura de la
      // repisa avanza unos 95 px. Saltando justo debajo se pasaba de largo.
      const meta = R.x0 + 8 + 95 - 70;
      E.stick.dx = K.x < meta ? 1 : 0;
      // Pulsar SALTA en el juego es a la vez el flanco (salta) y el boton
      // apretado (bSalta.pressed): sin lo segundo el salto se corta en el
      // mismo paso y se queda en 43 px, que no llegan a la repisa (88).
      if (K.x >= meta && K.enSuelo) { E.salta = true; E.bSalta.pressed = true; m.fase = 1; m.salto = n; }
    } else if (m.fase === 1) {
      E.stick.dx = 0;
      E.bSalta.pressed = n - m.salto < 20;             // salto completo
      if (K.enSuelo && K.y < 400) { m.fase = 2; m.arriba = n; }
    } else if (m.fase === 2) {
      // 2. arriba de la repisa: el ogro pisotea
      if (n - m.arriba === 10) { O.esperaT = 0; O.st = OG.ATACA; O.atk = OG.PISOTON; O.atkT = 0; O.golpeo = 0; O.animT = 0; }
      if (n - m.arriba > 150) m.fase = 3;
    } else if (m.fase === 3) {
      // 3. baja y va a por el
      E.stick.dx = O.x > K.x ? 1 : -1;
      if (Math.abs(O.x - K.x) < 190 && K.enSuelo) { E.stick.dx = 0; m.fase = 4; m.combo = n; }
    } else {
      E.stick.dx = 0;
      const k = n - m.combo;
      if (k === 0 || k === 12 || k === 24) E.golpea = true;
    }
  },

  // LA PARADA: el ogro suelta un garrotazo; ella levanta la guardia justo a
  // tiempo (el boton brilla en oro en esa ventana), el garrote rebota y el
  // siguiente ATACAR es el CONTRAATAQUE.
  parada(n, E, m) {
    const K = E.K, O = E.O;
    suelta(E);
    if (n === 0) { coloca(E, 480, 1, 700, -1); }
    if (n === 12) ataca(O, OG.GARROTE);
    E.bGuardia.pressed = n >= 26 && n < 46;
    if (n === 26) E.pulsos.guardia = 1;
    if (n === 58) pulsa(E, 'golpea', 'atacar');
  },

  // EL BARRIDO: la guardia no lo para; se esquiva hacia atras (sin stick).
  barrido(n, E, m) {
    suelta(E);
    if (n === 0) { coloca(E, 560, 1, 700, -1); }
    if (n === 10) ataca(E.O, OG.BARRIDO);
    if (n === 28) pulsa(E, 'esquiva', 'esquivar');
  },

  // LA EMBESTIDA: se esquiva ATRAVESANDOLO (stick hacia el + ESQUIVAR). Con la
  // pared detras de ella, el ogro sigue de largo, se estrella y se queda
  // aturdido: el hueco para el combo.
  embestida(n, E, m) {
    suelta(E);
    if (n === 0) { coloca(E, 150, 1, 320, -1); }
    if (n === 10) ataca(E.O, OG.EMBESTIDA);
    E.stick.dx = n >= 28 && n < 30 ? 1 : 0;
    if (n === 28) pulsa(E, 'esquiva', 'esquivar');
    if (n > 60 && n < 72) E.stick.dx = -1;             // se da la vuelta hacia el
    if (n === 78 || n === 90 || n === 104) pulsa(E, 'golpea', 'atacar');
  },

  // EL INICIO: la pantalla de elegir, un toque en NORMAL y la entrada entera.
  inicio(n, E, m) {
    if (n === 72) E.onInput({ type: 'down', x: 600, y: 300, id: 1 });
  },

  // LA VICTORIA: al ogro le quedan 3; el combo entero lo tumba, y se ve el
  // final a camara lenta y la nota.
  victoria(n, E, m) {
    suelta(E);
    // (Ya en su tercera fase: si no, el primer tajo le hace cruzarla, ruge
    // invulnerable 1.2 s y el resto del combo no cuenta.)
    if (n === 0) { coloca(E, 700, 1, 830, -1); E.O.hp = 3; E.O.fase = 3; }
    // A ritmo de pulgar: con pulsaciones sueltas, la congelacion de cada golpe
    // hacia que la segunda llegara antes de poder encadenar y no contaba.
    if (n >= 10 && n <= 130 && n % 14 === 10) pulsa(E, 'golpea', 'atacar');
  },
};
// Los guiones de la partida arrancan en la pantalla de elegir; el resto, ya
// peleando y con todo aprendido.
const DE_PARTIDA = ['inicio'];

// Lo que el pulgar suelta cada paso (los flancos duran un frame).
function suelta(E) { E.salta = false; E.golpea = false; E.esquiva = false; E.stick.dx = 0; }
// Pulsar un boton: el flanco y el aro del boton, como hace onInput.
function pulsa(E, flanco, boton) { E[flanco] = true; E.pulsos[boton] = 1; }
function coloca(E, kx, kdir, ox, odir) {
  E.K.x = kx; E.K.dir = kdir; E.O.x = ox; E.O.dir = odir; E.O.esperaT = 99;
}
function ataca(O, cual) {
  O.esperaT = 0; O.st = OG.ATACA; O.atk = cual; O.atkT = 0; O.golpeo = 0; O.animT = 0;
}

const params = new URLSearchParams(location.search);
const guion = GUIONES[params.get('s') || 'arena'];
const fps = +(params.get('fps') || 25), dura = +(params.get('dura') || 5.2), esc = +(params.get('escala') || 0.6);

const lienzo = document.createElement('canvas');
const g = initCanvas(lienzo);
setVirtual(1200, 540);
escena.init({}, {});
const nombre = params.get('s') || 'arena';
if (!DE_PARTIDA.includes(nombre)) {
  escena.maestro = P.makeMaestro({ aprendidas: [0, 1, 2, 3], pasadas: [] });
  escena.comenzar();
  escena.empiezaPelea();
}
// En filas de COLS: un lienzo de Chrome no pasa de 32767 px por lado, y 130
// fotogramas de 720 en fila son 93600 (salia en blanco).
const COLS = 10;
const CW = Math.round(1200 * esc), CH = Math.round(540 * esc), n = Math.ceil(dura * fps);
const tira = document.getElementById('tira');
tira.width = Math.min(n, COLS) * CW; tira.height = Math.ceil(n / COLS) * CH;
const t2 = tira.getContext('2d');
t2.imageSmoothingEnabled = true;          // reducir la tira suaviza; el juego sigue nitido
const memoria = { fase: 0 };
let paso = 0;
for (let i = 0; i < n; i++) {
  while (paso * DT < i / fps) {
    guion(paso, escena, memoria);
    escena.update(DT, {});
    updateParticles(DT);
    cam.update(DT, Math.random);
    paso++;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  g.save();
  if (cam.x || cam.y) g.translate(cam.x, cam.y);
  escena.draw(g, {}, 1);
  drawParticles(g);
  g.restore();
  t2.drawImage(lienzo, 0, 0, 1200, 540, (i % COLS) * CW, Math.floor(i / COLS) * CH, CW, CH);
}
document.title = 'listo ' + n;
</script>
