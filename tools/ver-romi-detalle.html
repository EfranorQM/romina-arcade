<!doctype html>
<!-- ROMINA a x3: idle, correr y bloquear, para ver la falda y los brazos.
       node tools/ver.js tools/ver-romi-detalle.html detalle.png 1750 1300 -->
<meta charset="utf-8">
<style>body{margin:0;background:#241c1a}canvas{display:block}</style>
<canvas id="c" width="1750" height="1300"></canvas>
<script type="module">
import { POSES } from '../www/js/games/romi-anim.js';
import { horneaPose } from '../www/js/games/romi-pose.js';
import { text } from '../www/js/font.js';
const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle = '#241c1a'; g.fillRect(0, 0, 1750, 1300);
let y = 10;
for (const [k, idx] of [['idle', [0, 3]], ['run', [0, 2, 4, 6]], ['block', [0, 1, 2, 3]]]) {
  text(g, k.toUpperCase(), 10, y, '#ffe066', 2);
  y += 20;
  let x = 10;
  for (const i of idx) {
    const cv = horneaPose(POSES[k][i]);
    g.drawImage(cv, x, y, cv.width * 2.2, cv.height * 2.2);
    x += cv.width * 2.2 + 8;
  }
  y += 180 * 2.2 + 16;
}
</script>
