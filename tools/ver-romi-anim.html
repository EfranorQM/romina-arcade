<!doctype html>
<!-- ROMINA: todas sus poses, a tamaño de juego y a x2.
       node tools/ver.js tools/ver-romi-anim.html anim.png 1500 1700 -->
<meta charset="utf-8">
<style>body{margin:0;background:#241c1a}canvas{display:block}</style>
<canvas id="c" width="1500" height="1780"></canvas>
<script type="module">
import { POSES } from '../www/js/games/romi-anim.js';
import { horneaPose } from '../www/js/games/romi-pose.js';
import { text } from '../www/js/font.js';

const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle = '#241c1a'; g.fillRect(0, 0, 1500, 1780);

let y = 14;
for (const k in POSES) {
  const arr = POSES[k];
  text(g, k.toUpperCase() + '  (' + arr.length + ' fotogramas)', 12, y, '#ffe066', 2);
  y += 22;
  // banda de suelo
  g.fillStyle = '#382c27'; g.fillRect(0, y, 1500, 190);
  g.fillStyle = '#4a3b33'; g.fillRect(0, y + 186, 1500, 4);
  let x = 20;
  for (const p of arr) {
    const cv = horneaPose(p);
    g.drawImage(cv, x, y + 190 - 180);
    x += 200;
  }
  y += 200;
}
</script>
