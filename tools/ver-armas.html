<!doctype html>
<!-- ROMINA: la espada y el escudo solos, en grande, en varios angulos.
       node tools/ver.js tools/ver-armas.html armas.png 1400 820 -->
<meta charset="utf-8">
<style>body{margin:0;background:#241c1a}canvas{display:block}</style>
<canvas id="c" width="1400" height="820"></canvas>
<script type="module">
import { makeLienzo, contorno, aCanvas, P, W, H } from '../www/js/games/romi-art.js';
import { dibujaEspada, dibujaEscudo } from '../www/js/games/romi-armas.js';
import { text } from '../www/js/font.js';

const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle = '#241c1a'; g.fillRect(0, 0, 1400, 820);

// Hornea una pieza sola en el centro del lienzo, con su contorno.
function pieza(fn, ang) {
  const L = makeLienzo();
  fn(L, 64, 90, ang);
  contorno(L, P.out, false);
  return aCanvas(L);
}

text(g, 'ESPADA  -  los angulos por los que pasa el tajo', 14, 12, '#ffe066', 2);
let x = 24;
for (const a of [-2.35, -1.2, -0.15, 0.85, 1.45]) {
  const cv = pieza(dibujaEspada, a);
  g.save();
  g.translate(x, 40); g.scale(5, 5);
  g.drawImage(cv, 0, 0);   // el lienzo entero, x5
  g.restore();
  text(g, a.toFixed(2), x + 200, 46, '#b8a9a0', 2);
  x += 272;
}

text(g, 'ESCUDO  -  de frente y ladeado', 14, 500, '#ffe066', 2);
for (let i = 0; i < 3; i++) {
  const a = [0, -0.35, 0.3][i];
  const cv = pieza(dibujaEscudo, a);
  g.save();
  g.translate(30 + i * 300, 528); g.scale(6, 6);
  // solo el trozo donde cae el escudo
  g.drawImage(cv, 36, 62, 56, 58, 0, 0, 56, 58);
  g.restore();
}
</script>
