<!doctype html>
<!-- EL ESCORZO DE LA CARA: la misma cara a distintos giros.
     Si el escorzo funciona, a giro alto se tiene que ver claramente que
     MIRA A LA DERECHA sin necesidad de flecha.
       node tools/ver.js tools/ver-escorzo.html escorzo.png 1500 780 -->
<meta charset="utf-8">
<style>body{margin:0;background:#241c1a}canvas{display:block}</style>
<canvas id="c" width="1500" height="780"></canvas>
<script type="module">
import { pose, dibujaPose } from '../www/js/games/romi-pose.js';
import { aCanvas } from '../www/js/games/romi-art.js';
import { text } from '../www/js/font.js';
const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle='#241c1a'; g.fillRect(0,0,1500,780);
const SX=36, SY=12, SW=56, SH=68;
const GIROS=[0,0.2,0.3,0.5,0.65,0.8];
text(g, 'EL GIRO DE LA CARA (cabGiro) -- a x4', 20, 14, '#ffe066', 2);
GIROS.forEach((cg,i)=>{
  const cv = aCanvas(dibujaPose(pose({cabGiro:cg})));
  g.save(); g.translate(20+i*240, 40); g.scale(4,4);
  g.drawImage(cv, SX,SY,SW,SH, 0,0,SW,SH); g.restore();
  text(g, 'cabGiro '+cg, 20+i*240, 320, '#ff8fbc', 2);
});
text(g, 'A TAMANO DE JUEGO (x1.95) -- ¿se ve que mira a la derecha?', 20, 356, '#ff8fbc', 2);
g.fillStyle='#3a2a3a'; g.fillRect(20, 380, 900, 150);
GIROS.forEach((cg,i)=>{
  const cv = aCanvas(dibujaPose(pose({cabGiro:cg})));
  g.save(); g.translate(30+i*145, 386); g.scale(1.95,1.95);
  g.drawImage(cv, SX,SY,SW,SH, 0,0,SW,SH); g.restore();
  text(g, ''+cg, 30+i*145, 540, '#7fe8ff', 2);
});
text(g, 'Y CON LOS GESTOS, a giro 0.5:', 20, 570, '#ffe066', 2);
const GESTOS=['normal','decidida','sorpresa','reojo','esfuerzo','cerrados'];
GESTOS.forEach((o,i)=>{
  const cv = aCanvas(dibujaPose(pose({cabGiro:0.5, ojos:o})));
  g.save(); g.translate(20+i*240, 596); g.scale(2.6,2.6);
  g.drawImage(cv, SX,SY,SW,SH, 0,0,SW,SH); g.restore();
  text(g, o, 20+i*240, 762, '#8a97b8', 2);
});
</script>
