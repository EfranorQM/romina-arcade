<!doctype html>
<!-- ¿SE LEE DE PERFIL O DE FRENTE? El banco de pruebas de la pose de combate.
     La pregunta no se juzga ampliado: se juzga a x1.95 sobre el fondo del
     campo, que es como se ve jugando. Si a ese tamaño no sabes hacia donde
     mira, la pose esta mal por bonita que sea ampliada.
       node tools/ver.js tools/ver-perfil.html perfil.png 1500 950 -->
<meta charset="utf-8">
<style>body{margin:0;background:#241c1a}canvas{display:block}</style>
<canvas id="c" width="1500" height="950"></canvas>
<script type="module">
import { POSES } from '../www/js/games/romi-anim.js';
import { pose, dibujaPose } from '../www/js/games/romi-pose.js';
import { aCanvas } from '../www/js/games/romi-art.js';
import { text } from '../www/js/font.js';
const g = document.getElementById('c').getContext('2d');
g.imageSmoothingEnabled = false;
g.fillStyle='#241c1a'; g.fillRect(0,0,1500,950);

// 1. La GUARDIA (idle[0]) y las poses clave, a tamaño de juego y sobre el
//    fondo del campo: la unica prueba que vale.
const CLAVE = [
  ['idle',  0, 'guardia'],
  ['run',   2, 'correr'],
  ['atk',   0, 'cargar'],
  ['atk',   1, 'impacto'],
  ['block', 1, 'bloquear'],
  ['bash',  1, 'empujon'],
  ['jump',  2, 'saltar'],
  ['hurt',  1, 'dolor'],
];
text(g, 'A TAMANO DE JUEGO, SOBRE EL CAMPO (x1.95) -- ¿hacia donde mira?', 20, 14, '#ff8fbc', 2);
g.fillStyle = '#3a2a3a'; g.fillRect(20, 38, 1180, 380);
CLAVE.forEach(([k,i,n],j)=>{
  const cv = aCanvas(dibujaPose(POSES[k][i]));
  g.save(); g.translate(30 + j*146, 44); g.scale(1.95,1.95);
  g.drawImage(cv, 0, 0); g.restore();
  text(g, n, 30 + j*146, 400, '#7fe8ff', 2);
});

// 2. Una FLECHA que marca hacia donde deberia mirar. Si el sprite no lo
//    dice solo, la flecha lo delata.
text(g, 'el enemigo esta SIEMPRE a la derecha ->', 20, 424, '#8a97b8', 2);

// 3. Las mismas, ampliadas, para ver el pixel de la cara y los hombros.
text(g, 'AMPLIADO (x3.4), solo para ver el pixel de cara y hombros', 20, 456, '#ffe066', 2);
CLAVE.slice(0,5).forEach(([k,i,n],j)=>{
  const cv = aCanvas(dibujaPose(POSES[k][i]));
  g.save(); g.translate(20 + j*290, 480); g.scale(3.4,3.4);
  // solo cabeza y hombros: y 10..95
  g.drawImage(cv, 30,10,80,86, 0,0,80,86); g.restore();
  text(g, n, 20 + j*290, 780, '#ffe066', 2);
});
</script>
